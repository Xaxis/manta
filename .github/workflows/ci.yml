name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-tests:
    name: Analysis tests + reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install the X11/GL libraries bpy links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: |
          PYTHONPATH=. python -m pytest analysis/ fcs/ -v --tb=short

      - name: Reproduce aero pipeline
        run: |
          PYTHONPATH=. python -m analysis.aero.planform.geometry > /dev/null
          PYTHONPATH=. python analysis/aero/weissinger/run.py > /dev/null
          PYTHONPATH=. python analysis/aero/lift_drag/cd0.py > /dev/null
          PYTHONPATH=. python analysis/aero/lift_drag/glide_polar.py > /dev/null
          PYTHONPATH=. python analysis/aero/trim/run.py > /dev/null

      - name: Reproduce structural pipeline
        run: |
          PYTHONPATH=. python -m analysis.struct.materials > /dev/null
          PYTHONPATH=. python -m analysis.struct.spar_model > /dev/null
          PYTHONPATH=. python analysis/struct/spar_bending.py > /dev/null
          PYTHONPATH=. python analysis/struct/mass_budget.py > /dev/null

      - name: Reproduce deployment pipeline
        run: |
          PYTHONPATH=. python -m analysis.deployment.state_machine > /dev/null
          PYTHONPATH=. python -m analysis.deployment.symmetry_budget > /dev/null
          PYTHONPATH=. python -m analysis.deployment.drogue_dynamics > /dev/null

      - name: Reproduce flight-dynamics pipeline
        run: |
          PYTHONPATH=. python -m analysis.flightdynamics.longitudinal > /dev/null
          PYTHONPATH=. python -m analysis.flightdynamics.lateral > /dev/null

      - name: Reproduce FCS / closed-loop pipeline
        run: |
          PYTHONPATH=. python -m fcs.envelope_protection.alpha_limiter > /dev/null
          PYTHONPATH=. python -m fcs.sim.closed_loop > /dev/null

      - name: Reproduce sim pipeline
        run: |
          PYTHONPATH=. python sim/aero.py > /dev/null
          PYTHONPATH=. python sim/flight_dynamics.py > /dev/null

      # The per-subsystem cad/ scripts were folded into one model in v2/v3:
      # sim/build.py builds wing, spars, ribs, harness, reserve, FCS bay and
      # CO2 pneumatics, and exports the GLB the site viewer ships. Its output
      # must match the committed files byte for byte.
      - name: Build vehicle model
        run: |
          PYTHONPATH=. python sim/build.py
          git diff --stat --exit-code -- sim/out/manta.glb sim/out/trajectory.json sim/out/control.json \
            site/public/models/v3/manta.glb site/public/models/v3/control.json

  site-build:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (required by Astro 6)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: bun run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
